name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true


      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Verify keystore
        run: |
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
        run: |
          echo "storePassword=$STOREPASSWORD" > android/key.properties
          echo "keyPassword=$KEYPASSWORD" >> android/key.properties
          echo "keyAlias=$KEYALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Verify key.properties
        run: |
          test -f android/key.properties
          test -f android/app/upload-keystore.jks
          echo "key.properties exists"
          echo "Keystore exists"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk


          